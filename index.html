<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>The Loop</title>
    <link rel="icon" href="data:," />
    <link
      rel="preload"
      href="/fonts/DepartureMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <div id="unlock-overlay" role="dialog" aria-modal="true" aria-labelledby="unlock-title">
      <h1 id="unlock-title">The Loop</h1>
      <button id="unlock-button" type="button" autofocus>
        Enter — headphones recommended
      </button>
      <button id="demo-button" type="button">Watch the demo flight</button>
      <!--
        §217 (user): say how it is flown, on the way in. Nothing here was
        written from memory — every line is what `DEFAULT_BINDINGS` actually
        binds. The right mouse button is deliberately absent: it is not bound
        to anything, and listing it would be the kind of instruction that makes
        a player think they broke something.

        Hidden on touch, where none of it is true and the screen is short.
      -->
      <dl class="controls" aria-label="Controls">
        <div><dt>W A S D</dt><dd>fly — W is the throttle</dd></div>
        <div><dt>Mouse</dt><dd>look, and the direction you look is the world you get</dd></div>
        <div><dt>Left button</dt><dd>the wind — hold it, and let go for the pulse</dd></div>
        <div><dt>Shift</dt><dd>hyperspeed, while you hold it</dd></div>
        <div><dt>C · E · G</dt><dd>the score · export the track · the guide</dd></div>
        <div><dt>Esc</dt><dd>pause</dd></div>
      </dl>
      <!--
        AGPL-3.0 §13: this page ships a copy of Strudel to everyone who opens
        it, so everyone who opens it is owed the source of the whole thing.
        That is what this line is — not a credit, an obligation, and the
        cheapest possible way to meet it.
      -->
      <p class="colophon">
        <a href="https://github.com/jeenavanderheul/Soundscape" target="_blank" rel="noopener">source</a>
        · AGPL-3.0 · audio by
        <a href="https://strudel.cc" target="_blank" rel="noopener">Strudel</a>
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
